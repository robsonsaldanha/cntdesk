name: Build Windows Installer
on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

env:
  CARGO_TERM_COLOR: always
  VCPKG_ROOT: C:\vcpkg

jobs:
  build-windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Visual Studio 2022
        uses: microsoft/setup-msbuild@v2

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Setup vcpkg
        run: |
          git clone https://github.com/microsoft/vcpkg.git C:\vcpkg
          C:\vcpkg\bootstrap-vcpkg.bat
          C:\vcpkg\vcpkg integrate install

      - name: Install vcpkg dependencies
        run: |
          C:\vcpkg\vcpkg install --classic --triplet x64-windows-static libvpx libyuv opus aom ffmpeg[x264]

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Build using RustDesk build.py
        env:
          VCPKG_ROOT: C:\vcpkg
        run: |
          python build.py --flutter --hwcodec

      - name: Package installer
        run: |
          $exe = "target/release/cntdesk.exe"
          $flutter_build = "flutter/build/windows/x64/runner/Release"
          New-Item -ItemType Directory -Force -Path "dist"
          Copy-Item $exe "dist/"
          if (Test-Path $flutter_build) {
            Copy-Item "$flutter_build/*" "dist/" -Recurse
          }
          Compress-Archive -Path "dist/*" -DestinationPath "CNT.Desk_${{ github.run_number }}_windows.zip"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: cntdesk-windows
          path: CNT.Desk_${{ github.run_number }}_windows.zip

      - name: Create Release
        if: github.ref == 'refs/heads/master'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: CNT Desk Build ${{ github.run_number }}
          files: CNT.Desk_${{ github.run_number }}_windows.zip
          draft: false
          prerelease: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}