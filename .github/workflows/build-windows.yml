name: Build Windows Installer

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

env:
  CARGO_TERM_COLOR: always

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'

      - name: Build Flutter UI
        run: |
          cd flutter
          flutter pub get
          flutter build windows --release

      - name: Build Rust binary
        run: cargo build --release --features flutter

      - name: Package installer
        run: |
          $exe = "target/release/cntdesk.exe"
          $flutter_build = "flutter/build/windows/x64/runner/Release"
          New-Item -ItemType Directory -Force -Path "dist"
          Copy-Item $exe "dist/"
          Copy-Item "$flutter_build/*" "dist/" -Recurse
          Compress-Archive -Path "dist/*" -DestinationPath "CNT.Desk_${{ github.run_number }}_windows.zip"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: cntdesk-windows
          path: CNT.Desk_${{ github.run_number }}_windows.zip

      - name: Create Release
        if: github.ref == 'refs/heads/master'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: CNT Desk Build ${{ github.run_number }}
          files: CNT.Desk_${{ github.run_number }}_windows.zip
          draft: false
          prerelease: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}