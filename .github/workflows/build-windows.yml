name: Build Windows Installer
on:
  push:
    branches: [master, main]
  workflow_dispatch:
jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install frontend dependencies
        working-directory: ui
        run: npm install
      - name: Build frontend
        working-directory: ui
        run: npm run build
      - name: Install Tauri CLI
        run: cargo install tauri-cli --version "^2"
      - name: Build Windows installer
        working-directory: crates/cntdesk-client
        run: cargo tauri build --target x86_64-pc-windows-msvc
      - name: Upload installer artifacts
        uses: actions/upload-artifact@v4
        with:
          name: cntdesk-windows-installer
          path: |
            crates/cntdesk-client/target/x86_64-pc-windows-msvc/release/bundle/msi/*.msi
            crates/cntdesk-client/target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe
          retention-days: 30